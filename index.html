<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>この人まだ生きてる？クイズ</title>

<style>
body{
    font-family:sans-serif;
    max-width:900px;
    margin:auto;
    padding:20px;
    text-align:center;
}

h1{
    margin-bottom:10px;
}

#timer{
    font-size:24px;
    color:red;
    margin:20px;
}

#question{
    font-size:32px;
    margin:40px 0;
}

button{
    font-size:24px;
    padding:10px 30px;
    margin:10px;
    cursor:pointer;
}

#message{
    font-size:20px;
    margin-top:20px;
    min-height:80px;
}

#score{
    font-size:20px;
    margin-top:20px;
}

.result{
    text-align:left;
    border:1px solid #ccc;
    padding:10px;
    margin:10px 0;
    border-radius:8px;
}

.correct{
    color:green;
    font-weight:bold;
}

.wrong{
    color:red;
    font-weight:bold;
}

.review{
    background:#fff8e1;
}

</style>
</head>

<body>

<h1>この人まだ生きてる？クイズ</h1>

<div id="timer">残り60秒</div>

<div id="score"></div>

<div id="question"></div>

<div id="buttons">
    <button onclick="answer(true)">○ 生存</button>
    <button onclick="answer(false)">× 死亡</button>
</div>

<div id="message"></div>

<script>

const people = [

{
    name:"美輪明宏",
    alive:false,
    born:1935,
    died:2026,
    note:"歌手・俳優・演出家。2026年逝去。"
},
{
    name:"瀬戸内寂聴",
    alive:false,
    born:1922,
    died:2021,
    note:"作家・僧侶。2021年逝去。"
},
{
    name:"細木数子",
    alive:false,
    born:1938,
    died:2021,
    note:"占術家。六星占術で知られる。"
},
{
    name:"假屋崎省吾",
    alive:true,
    born:1958,
    note:"華道家。テレビ出演も多い。"
},
{
    name:"大屋政子",
    alive:false,
    born:1921,
    died:1999,
    note:"タレント・実業家。"
},
{
    name:"塩沢とき",
    alive:false,
    born:1928,
    died:2007,
    note:"個性的な女優として活躍。"
},
{
    name:"大山のぶ代",
    alive:false,
    born:1933,
    died:2024,
    note:"ドラえもん役で有名な声優。"
},
{
    name:"樹木希林",
    alive:false,
    born:1943,
    died:2018,
    note:"日本を代表する女優。"
},
{
    name:"岸田今日子",
    alive:false,
    born:1930,
    died:2006,
    note:"女優・声優。"
},
{
    name:"市原悦子",
    alive:false,
    born:1936,
    died:2019,
    note:"『まんが日本昔ばなし』の語り手。"
},
{
    name:"ガッツ石松",
    alive:false,
    born:1949,
    died:2026,
    note:"元WBC世界ライト級王者。2026年逝去。"
},
{
    name:"具志堅用高",
    alive:true,
    born:1955,
    note:"元WBA世界王者。"
},
{
    name:"渡嘉敷勝男",
    alive:true,
    born:1960,
    note:"元プロボクサー。"
},
{
    name:"森本レオ",
    alive:false,
    born:1943,
    died:2026,
    note:"俳優・ナレーター。2026年逝去。"
},
{
    name:"曙太郎",
    alive:false,
    born:1969,
    died:2024,
    note:"元横綱。"
},
{
    name:"小錦八十吉",
    alive:true,
    born:1963,
    note:"元大関。タレントとしても活動。"
},
{
    name:"ウガンダ・トラ",
    alive:false,
    born:1952,
    died:2008,
    note:"タレント・ダンサー。"
},
{
    name:"グレート義太夫",
    alive:false,
    born:1958,
    died:2026,
    note:"たけし軍団のメンバー。2026年逝去。"
},
{
    name:"彦摩呂",
    alive:true,
    born:1966,
    note:"グルメリポーター。"
},
{
    name:"やくみつる",
    alive:true,
    born:1959,
    note:"漫画家・コラムニスト。"
},
{
    name:"つのだじろう",
    alive:true,
    born:1939,
    note:"漫画家。『恐怖新聞』で有名。"
},
{
    name:"イッセー尾形",
    alive:true,
    born:1952,
    note:"一人芝居で知られる俳優。"
},
{
    name:"レオナルド熊",
    alive:false,
    born:1935,
    died:1994,
    note:"コメディアン。"
}

];

people.sort(() => Math.random() - 0.5);

let current = 0;
let correct = 0;
let answered = 0;
let timeLeft = 60;

let history = [];

function showQuestion(){

    if(current >= people.length){
        finishQuiz();
        return;
    }

    document.getElementById("question").innerText =
        people[current].name;

    document.getElementById("score").innerText =
        `正解数 ${correct} / ${answered}`;
}

function answer(choice){

    const person = people[current];

    const isCorrect =
        choice === person.alive;

    if(isCorrect) correct++;

    history.push({
        name:person.name,
        userAnswer:choice,
        correctAnswer:person.alive,
        result:isCorrect,
        born:person.born,
        died:person.died,
        note:person.note
    });

    let message =
        isCorrect
        ? "<span class='correct'>⭕ 正解</span>"
        : "<span class='wrong'>❌ 不正解</span>";

    message += "<br><br>";

    if(person.alive){

        message += `
        現在も存命<br>
        ${person.born}年生まれ<br>
        ${person.note}
        `;

    }else{

        message += `
        ${person.born}～${person.died}<br>
        ${person.note}
        `;
    }

    document.getElementById("message").innerHTML =
        message;

    answered++;
    current++;

    setTimeout(showQuestion,2500);
}

function finishQuiz(){

    clearInterval(timer);

    let html = `
    <h2>終了！</h2>
    <p>${answered}問中 ${correct}問正解</p>
    <p>正答率 ${
        answered
        ? Math.round(correct / answered * 100)
        : 0
    }%</p>
    <hr>
    `;

    const mistakes =
        history.filter(x => !x.result);

    if(mistakes.length){

        html += `
        <h2>復習推奨</h2>
        `;

        mistakes.forEach(item => {

            html += `
            <div class="result review">

                <b>${item.name}</b><br>

                あなた：
                ${item.userAnswer ? "生存":"死亡"}<br>

                正解：
                ${item.correctAnswer ? "生存":"死亡"}<br>

                <span class="wrong">❌ 不正解</span><br>

                ${item.correctAnswer
                    ? `${item.born}年生まれ（存命）`
                    : `${item.born}～${item.died}`
                }<br>

                ${item.note}

            </div>
            `;
        });

        html += "<hr>";
    }

    html += "<h2>結果一覧</h2>";

    history.forEach((item,index)=>{

        html += `
        <div class="result">

            <b>${index + 1}. ${item.name}</b><br>

            あなた：
            ${item.userAnswer ? "生存":"死亡"}<br>

            正解：
            ${item.correctAnswer ? "生存":"死亡"}<br>

            <span class="${
                item.result
                ? "correct"
                : "wrong"
            }">

            ${
                item.result
                ? "⭕ 正解"
                : "❌ 不正解"
            }

            </span>

            <br>

            ${
                item.correctAnswer
                ? `${item.born}年生まれ（存命）`
                : `${item.born}～${item.died}`
            }

            <br>

            ${item.note}

        </div>
        `;
    });

    document.getElementById("question").innerHTML =
        html;

    document.getElementById("buttons").style.display =
        "none";

    document.getElementById("message").innerHTML = "";

    document.getElementById("timer").innerHTML =
        "終了";
}

showQuestion();

const timer = setInterval(()=>{

    timeLeft--;

    document.getElementById("timer").innerText =
        `残り${timeLeft}秒`;

    if(timeLeft <= 0){

        finishQuiz();
    }

},1000);

</script>

</body>
</html>
