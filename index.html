<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>この人まだ生きてる？クイズ</title>

<style>
body{
    font-family:sans-serif;
    max-width:800px;
    margin:auto;
    padding:20px;
}

.person{
    margin:10px 0;
}

button{
    margin-left:10px;
}
</style>
</head>

<body>

<h1>この人まだ生きてる？クイズ</h1>

<div id="quiz"></div>

<button onclick="scoreQuiz()">採点</button>

<h2 id="result"></h2>

<script>

const people = [
{ name:"美輪明宏", alive:true },
{ name:"瀬戸内寂聴", alive:false },
{ name:"細木数子", alive:false },
{ name:"假屋崎省吾", alive:true },
{ name:"大屋政子", alive:false }
];

let html="";

people.forEach((p,i)=>{
html += `
<div class="person">
${p.name}
<label><input type="radio" name="p${i}" value="true">○</label>
<label><input type="radio" name="p${i}" value="false">×</label>
</div>
`;
});

document.getElementById("quiz").innerHTML=html;

function scoreQuiz(){

let score=0;

people.forEach((p,i)=>{

const ans=document.querySelector(
`input[name="p${i}"]:checked`
);

if(ans && String(p.alive)===ans.value){
score++;
}

});

document.getElementById("result").innerHTML =
`${people.length}問中 ${score}問正解！`;

}

</script>

</body>
</html>
